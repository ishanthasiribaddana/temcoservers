version: '3.8'

# =============================================================================
# TemcoServers Platform - Docker Compose
# =============================================================================
# Connects to existing temco-admin-mariadb container on temco-network.
# No new MariaDB instance is created.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Java EE Backend (WildFly 30)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: temcoservers-backend
    restart: unless-stopped
    environment:
      DB_HOST: temco-admin-mariadb
      DB_PORT: 3306
      DB_NAME: ijts_recovery_db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CONTABO_CLIENT_ID: ${CONTABO_CLIENT_ID}
      CONTABO_CLIENT_SECRET: ${CONTABO_CLIENT_SECRET}
      CONTABO_API_USER: ${CONTABO_API_USER}
      CONTABO_API_PASSWORD: ${CONTABO_API_PASSWORD}
      AI_MODULE_URL: http://temcoservers-ai-module:8000
    ports:
      - "127.0.0.1:8180:8080"
    networks:
      - temco-network

  # ---------------------------------------------------------------------------
  # Python AI Module (internal — same DB, called by backend)
  # ---------------------------------------------------------------------------
  ai-module:
    build:
      context: ./ai-module
      dockerfile: Dockerfile
    container_name: temcoservers-ai-module
    restart: unless-stopped
    environment:
      DB_HOST: temco-admin-mariadb
      DB_PORT: 3306
      DB_NAME: ijts_recovery_db
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
    ports:
      - "127.0.0.1:8580:8000"
    networks:
      - temco-network

  # ---------------------------------------------------------------------------
  # React Frontend (Vite Dev Server)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: temcoservers-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8180/api
      VITE_AI_URL: http://localhost:8580
    ports:
      - "127.0.0.1:3010:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - temco-network

volumes:
  frontend_node_modules:

networks:
  temco-network:
    external: true
    name: temco-network
