version: '3.8'

# =============================================================================
# TemcoServers Platform - Production Docker Compose
# =============================================================================
# Deploys all 4 services on production server (194.163.130.223).
# Frontend served via Nginx (production build), not Vite dev server.
#
# CI/CD mode (normal): GitHub Actions builds images, SCPs to server,
#   loads via docker load, tags as latest. No registry needed.
#   Usage: docker compose -f docker-compose.prod.yml up -d
#
# Fallback mode (manual): Build from source on server.
#   Usage: docker compose -f docker-compose.prod.yml up -d --build
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # MariaDB Database
  # ---------------------------------------------------------------------------
  mariadb:
    image: mariadb:11.8
    container_name: temcoservers-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME:-ijts_recovery_db}
    volumes:
      - mariadb-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - temco-network

  # ---------------------------------------------------------------------------
  # Java EE Backend (WildFly 30)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: temcoservers-backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-temcoservers-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-ijts_recovery_db}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CONTABO_CLIENT_ID: ${CONTABO_CLIENT_ID}
      CONTABO_CLIENT_SECRET: ${CONTABO_CLIENT_SECRET}
      CONTABO_API_USER: ${CONTABO_API_USER}
      CONTABO_API_PASSWORD: ${CONTABO_API_PASSWORD}
      AI_MODULE_URL: http://temcoservers-ai-module:8000
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-live}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-TemcoServers}
    volumes:
      - uploads-data:/opt/temcoservers/uploads
    ports:
      - "8180:8080"
    networks:
      - temco-network
    depends_on:
      - ai-module
      - mariadb

  # ---------------------------------------------------------------------------
  # Python AI Module (internal — same DB, called by backend)
  # ---------------------------------------------------------------------------
  ai-module:
    build:
      context: ./ai-module
      dockerfile: Dockerfile
    container_name: temcoservers-ai-module
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-temcoservers-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-ijts_recovery_db}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports:
      - "8580:8000"
    networks:
      - temco-network
    depends_on:
      - mariadb

  # ---------------------------------------------------------------------------
  # React Frontend (Nginx — production build)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: temcoservers-frontend
    restart: unless-stopped
    volumes:
      - uploads-data:/usr/share/nginx/uploads:ro
    ports:
      - "3010:80"
    depends_on:
      - backend
    networks:
      - temco-network

volumes:
  mariadb-data:
  uploads-data:

networks:
  temco-network:
    external: true
    name: temco-network
